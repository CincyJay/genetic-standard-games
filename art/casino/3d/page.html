<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body style="margin: 0; background: transparent">
    <script type="module">
      import { loadFonts, setupRenderer, snapshot } from './kit.js';
      import { SETS as S1 } from './symbols.js';
      import { SETS2 } from './symbols2.js';
      const SETS = { ...S1, ...SETS2 };
      import { LOGOS } from './logos.js';
      import { renderRoom } from './rooms.js';
      import { UI } from './ui.js';
      import { renderWorld } from './worlds.js';
      import { CHIP_COLORS, ball, chip, dealerButton, pill, renderCabinet, renderCardTable, renderTable, renderTopDown, ring, rouletteBowl, rouletteRotor, seriesLogo, trophy } from './poker.js';
      await loadFonts();
      setupRenderer(320, 320);
      globalThis.renderSymbols = (sets) => {
        const out = {};
        for (const set of sets.length ? sets : Object.keys(SETS)) {
          out[set] = {};
          for (const [name, build] of Object.entries(SETS[set])) out[set][name] = snapshot(build(), { size: 320, pad: 0.08 });
        }
        return out;
      };
      globalThis.renderLogos = () => Object.fromEntries(Object.entries(LOGOS).map(([id, b]) => [id, snapshot(b(), { width: 1000, height: 180, pad: 0.04, tilt: [0.22, 0], fov: 10 })]));
      globalThis.renderRoom = (id) => renderRoom(id);
      globalThis.renderUi = () => Object.fromEntries(Object.entries(UI).map(([k, u]) => [k, snapshot(u.build(), { width: u.w, height: u.h, pad: 0.03, tilt: u.tilt, fov: 14 })]));
      globalThis.renderWorld = (id) => renderWorld(id);
      globalThis.renderPoker = () => {
        const out = {};
        out['table-poker.jpg'] = renderTable('#0c2a6e');
        out['table-final.jpg'] = renderTable('#6a0a18');
        const sq = (o, size, tilt) => snapshot(o, { size, pad: 0.04, tilt, fov: 20 });
        for (const v of Object.keys(CHIP_COLORS)) {
          out[`ui/chip-${v}.png`] = sq(chip(Number(v)), 180, [Math.PI / 2 - 0.12, 0]);
          out[`ui/chipside-${v}.png`] = snapshot(chip(Number(v)), { width: 160, height: 100, pad: 0.03, tilt: [0.55, 0], fov: 20 });
        }
        out['ui/dealer.png'] = sq(dealerButton(), 120, [Math.PI / 2 - 0.25, 0]);
        for (const k of ['gold', 'silver', 'bronze']) out[`ui/trophy-${k}.png`] = sq(trophy(k), 300, [0.1, -0.3]);
        out['ui/ring.png'] = sq(ring(), 300, [0.2, -0.4]);
        out['logos/poker-series.png'] = snapshot(seriesLogo(), { width: 1000, height: 300, pad: 0.04, tilt: [0.2, 0], fov: 10 });
        const pills = { fold: 0xb8101e, call: 0x1a5ac8, raise: 0x18a050, dark: 0x2a2430, gold: 0xe9b949, purple: 0x5a1a8a };
        for (const [k, c] of Object.entries(pills)) out[`ui/pill-${k}.png`] = snapshot(pill(c), { width: 420, height: 153, pad: 0.02, tilt: [0, 0], fov: 12 });
        return out;
      };
      globalThis.renderTables = () => {
        const out = {};
        const big = (t) => ({ text: t, font: '900 84px Georgia, serif', x: 540, y: 770 });
        const small = (t) => ({ text: t, font: '600 30px Georgia, serif', x: 540, y: 826, color: 'rgba(255,244,220,0.55)' });
        const arc = { x: 540, y: 300, r: 620, a0: (52 * Math.PI) / 180, a1: (128 * Math.PI) / 180 };
        const T = {
          blackjack: { felt: '#0f5a3a', tray: true, shoe: { x: 940, y: 330 }, prints: [big('BLACKJACK PAYS 3 TO 2'), small('Dealer stands on all 17s  ·  side bets 21+3 and Perfect Pairs')], lines: [arc] },
          baccarat: { felt: '#6a0a18', tray: true, shoe: { x: 940, y: 330 }, prints: [big('BACCARAT'), small('Banker pays 0.95 to 1  ·  Tie pays 8 to 1')], lines: [arc] },
          threecard: { felt: '#0c2a6e', tray: true, prints: [big('THREE CARD POKER'), small('Dealer plays with Queen high or better')], lines: [arc] },
          war: { felt: '#3a0f4a', tray: true, shoe: { x: 940, y: 330 }, prints: [big('CASINO WAR'), small('Ties: go to war, or surrender half your bet')], lines: [arc] },
          roulette: { felt: '#0f5a3a', railY: 1745, prints: [] },
        };
        for (const [k, cfg] of Object.entries(T)) out[`table-${k}.jpg`] = renderCardTable(cfg);
        out['cabinet-videopoker.jpg'] = renderCabinet();
        out['ui/roulette-rotor.png'] = renderTopDown(rouletteRotor(920).grp, 920);
        out['ui/roulette-bowl.png'] = renderTopDown(rouletteBowl(920).grp, 1080);
        out['ui/ball.png'] = snapshot(ball(), { size: 64, pad: 0.02, tilt: [0, 0], fov: 20 });
        return out;
      };
      globalThis.ready = true;
    </script>
  </body>
</html>
